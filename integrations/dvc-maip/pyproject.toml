[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dvc-maip"
version = "1.1.0"
readme = "README.md"
description = "DVC plugin for Machine-Actionable Integrity Protocol (MAIP) receipt generation"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    { name = "Truthlocks Inc", email = "support@truthlocks.com" },
]
keywords = [
    "dvc",
    "maip",
    "machine-identity",
    "integrity-protocol",
    "data-provenance",
    "cryptographic-proof",
    "data-version-control",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "maip-ai-connectors>=1.1.0,<2",
    "dvc>=3.0",
    "httpx>=0.24",
    "pydantic>=2.0",
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.21",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://truthlocks.com"
Documentation = "https://docs.truthlocks.com/sdk/dvc-maip"
Repository = "https://github.com/truthlocks/maip"
Issues = "https://github.com/truthlocks/maip/issues"

[project.entry-points."dvc.command"]
maip = "dvc_maip.cli:MAIPCommand"

[tool.hatch.build.targets.wheel]
packages = ["src/dvc_maip"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

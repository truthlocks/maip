[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "truthlocks-bedrock"
version = "1.1.0"
description = "Truthlocks MAIP wrapper for AWS Bedrock — auto-generate cryptographic receipts for every model invocation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "Truthlocks Inc", email = "support@truthlocks.com" }]
keywords = ["truthlocks", "maip", "aws", "bedrock", "receipts", "machine-identity", "ai-provenance"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
]
dependencies = ["maip-ai-connectors[bedrock]>=1.1.0,<2"]

[project.urls]
Homepage = "https://truthlocks.com"
Documentation = "https://docs.truthlocks.com/sdk/bedrock"
Repository = "https://github.com/truthlocks/maip"

[tool.hatch.build.targets.wheel]
packages = ["src/truthlocks_bedrock"]

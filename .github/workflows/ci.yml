name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.22', '1.23']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies (reference)
        working-directory: ./reference
        run: go mod download

      - name: Test reference library
        working-directory: ./reference
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Test verifier
        working-directory: ./verifier
        run: go test -v -race ./...

      - name: Test examples build
        run: |
          cd examples/register-agent && go build -o /dev/null .
          cd ../verify-bundle && go build -o /dev/null .

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Vet reference library
        working-directory: ./reference
        run: go vet ./...

      - name: Vet verifier
        working-directory: ./verifier
        run: go vet ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build verifier
        working-directory: ./verifier
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          go build -ldflags="-s -w -X main.Version=$(git describe --tags --always --dirty)" \
            -o ../bin/maip-verifier-${{ matrix.goos }}-${{ matrix.goarch }}${EXT} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: maip-verifier-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/maip-verifier-*
